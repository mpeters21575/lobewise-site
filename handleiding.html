<script type="text/markdown" id="md"># LobeWise voor beginners: van idee tot audiofiele luidspreker

Deze handleiding neemt je stap voor stap mee door LobeWise: van een leeg project tot een luidspreker die je hebt ontworpen, gebouwd, gemeten en afgestemd. Je hoeft geen elektronica of akoestiek te kennen. Elke stap zegt wat je doet, waar je op let en wanneer je door mag.

**Hoeveel tijd kost het?** Ontwerpen (deel A) ongeveer een avond. Bouwen (deel B) een weekend, afhankelijk van je kast. Meten en afstemmen (deel C) nog een avond.

**Wat heb je nodig?**

- Een computer met Chrome, Edge, Safari of Firefox. LobeWise draait in de browser, er is niets te installeren en je hebt geen account nodig.
- Een idee van wat je wilt bouwen: bijvoorbeeld een tweeweg boekenplankluidspreker.
- De meetbestanden van je drivers (FRD en ZMA). De fabrikant zet die meestal op zijn site. Heb je ze niet, dan kun je ook met de Thiele/Small-getallen uit de datasheet werken.
- Voor deel C: een meetmicrofoon (USB of met een kalibratiebestand) en een koptelefoon.

**Oefen eerst met een voorbeeld.** In stap 2 staat de knop **Voorbeeld laden: Classix III**. Dat is een gepubliceerd ontwerp van Paul Carmody met echte Dayton-drivers. Loop deze handleiding één keer door met dat voorbeeld. Daarna doe je hetzelfde met je eigen drivers.

---

## Zo leest LobeWise

**De stappenbalk.** Bovenaan staan de stappen: 1 Doelen tot en met 7 Luisteren voor het ontwerpen, en M1 tot en met M5 voor meten en afstemmen. Je mag vrij springen, maar de volgorde is niet toevallig: elke stap gebruikt wat je ervoor hebt ingevuld.

![De stappenbalk met de status per stap; hier is stap 4 Crossover open.](img/hero-app.webp)
*De stappenbalk met de status per stap; hier is stap 4 Crossover open.*

**De kleuren.** Achter elke stap staat een status:

| Teken | Betekenis | Wat je doet |
|---|---|---|
| ✓ groen | Voldoet | Niets. Door naar de volgende stap. |
| ▲ oranje | Waarschuwing | Lees de uitleg. Vaak is er een knop die het oplost. |
| ✕ rood | Voldoet niet | Dit moet je oplossen voordat je bouwt. |
| ○ grijs | Open of onvoldoende gegevens | Er ontbreekt nog iets, de uitleg zegt wat. |
| ◇ | Buiten model | LobeWise kan dit niet berekenen met de data die je hebt. Niet erg, wel goed om te weten. |
| Bekend | Je hebt een waarschuwing als "bekend" gemarkeerd | Hij telt niet meer mee. "Weer melden" zet hem terug. |

**Elke controle legt zichzelf uit.** Onder een controle staat de grens, de methode en wat je kunt doen. Bij bijna elke waarschuwing staat een knop **Automatisch oplossen: …**. Die doet één wijziging, en meldt wat er elders in het project door verandert.

**Alles oplossen.** De knop rechtsboven probeert alle oplosknoppen tegelijk, controleert na elke stap het hele project opnieuw en houdt alleen wat het totaal beter maakt. Wijzigingen die je Doelen zouden veranderen, past hij niet toe; die krijg je als keuze met een knop **Toch toepassen**.

**Ongedaan maken.** Alles wat de app voor je doet, is één stap Ongedaan maken. Probeer dus gerust.

**Opslaan hoeft niet.** Je project wordt automatisch in de browser bewaard. Met **Exporteren** maak je een bestand voor jezelf of een ander apparaat.

---

## Deel A: ontwerpen

### Stap 1: Doelen

Hier vertel je LobeWise waar de luidspreker komt en wat hij moet kunnen. Deze getallen worden de grenzen van alle controles.

![Stap 1, Doelen: plaatsing, niveau, signaal en versterker.](img/targets.webp)
*Stap 1, Doelen: plaatsing, niveau, signaal en versterker.*

**Luidspreker en plaatsing**

- **Type**: boekenplank, vloerstaander, center, surround of subwoofer.
- **Maximale diepte**: hoe diep de kast mag zijn op de plek waar hij komt.
- **Afstand tot voorwand**: de afstand van de achterkant van de kast tot de muur. Dicht bij de muur geeft meer bas en meer kans op een dip rond 100 tot 300 Hz.
- **Luisterafstand**: hoe ver je zit. Dit is gekoppeld aan stap 6, Kamer: verander je het hier, dan schuift de luisterplek daar mee.

**Niveau en basbeheer**

- **Maximaal niveau**: hoe hard het op je luisterplek moet kunnen. 95 dB is luid voor een huiskamer. Hoe hoger, hoe strenger de controles op uitslag en poortsnelheid.
- **Basbeheer**: zet dit aan als je een subwoofer hebt die het laag overneemt (bijvoorbeeld onder 80 Hz). Een kleine luidspreker hoeft dan geen diep laag te maken, en veel waarschuwingen in stap 3 verdwijnen.

**Versterker**

Kies je versterker uit de lijst of vul het vermogen, de uitgangsimpedantie en de minimale belasting in. De minimale belasting bepaalt hoe laag de impedantie van je crossover mag worden.

**Signaal voor belastingscontrole.** Laat dit op *Roze ruis* staan. Dat is hoe muziek gemiddeld belast. *Sinus* is de strengste grens en alleen nodig als je zekerheid wilt voor elk onderdeel.

> **Door als:** je alles hebt ingevuld. Deze stap heeft geen controles die rood kunnen worden.

### Stap 2: Drivers

Hier komen de drivers in het project, met hun meetgegevens en hun plek op het front.

![Stap 2, Drivers: de driverkaart met bibliotheek, bestanden en de respons rechts.](img/drivers.webp)
*Stap 2, Drivers: de driverkaart met bibliotheek, bestanden en de respons rechts.*

**Driver toevoegen**

1. Klik **+ Driver toevoegen**. De driver krijgt vanzelf een vrije plek op het front.
2. Typ in **Zoeken in bibliotheek** een merk of type (bijvoorbeeld "SB17" of "Dayton"). Kies een driver uit de lijst. De naam, impedantie, Thiele/Small-waarden en kastadvies worden ingevuld.
3. Sleep de **FRD** (frequentierespons) en **ZMA** (impedantie) van de fabrikant in het vak, of kies ze met de knoppen. Heb je geen bestanden, sla dit dan over: LobeWise rekent dan met een model uit de Thiele/Small-waarden. Dat is goed genoeg voor de kast, maar minder precies voor de crossover.

**Drie vragen bij elk bestand**

- **Waar is deze ZMA gemeten?** *Losse driver (vrije lucht)* voor een fabrieksmeting; *In de kast* als je hem zelf in je kast hebt gemeten. LobeWise rekent de kast er dan bij of juist niet.
- **Zit de baffle en de kast al in de FRD?** Een fabrieksmeting is meestal op een grote standaardbaffle gemeten, zonder jouw kast. Bij bekende fabrikanten (Dayton, SEAS, …) herkent LobeWise dit aan de kop van het bestand en zet het goed.
- **Tijdreferentie**: hebben alle FRD's dezelfde meetvertraging? Bij losse fabrieksbestanden weet je dat niet. Dan krijg je een waarschuwing met een knop die het probeert op te lossen (minimum-fase). Beter is: meet de drivers zelf vanaf één microfoonpositie (stap M1), dan is deze vraag weg.

**Positie op het front.** Zet de tweeter boven en de woofer eronder, met de middens boven elkaar op één lijn. De exacte plek pas je in stap 3 aan door te slepen.

**Polariteit.** Laat die hier gewoon staan. Omkeren doe je in de crossover, als de simulatie laat zien dat het nodig is.

> **Door als:** elke driver een naam, impedantie en óf bestanden óf Thiele/Small-waarden heeft. De controle "Driverdata compleet" is dan groen.

### Stap 3: Kast

Hier maak je de kast en zet je de drivers op hun plek. Je ziet direct wat dat doet met het laag, de uitslag en de poort.

![Stap 3, Kast: front met de drivers, en rechts het kastmodel met SPL en impedantie.](img/cabinet.webp)
*Stap 3, Kast: front met de drivers, en rechts het kastmodel met SPL en impedantie.*

**Front en kast**

1. Vul **Breedte**, **Hoogte** en **Diepte** in. Een smal front (iets breder dan de woofer plus 2 cm per kant) klinkt het meest ruimtelijk.
2. Vul de **Wanddikte** in (18 of 19 mm bij MDF of multiplex). LobeWise controleert of het netto volume echt in de kast past.
3. Zet de drivers op hun plek. In het **Vooraanzicht** sleep je ze over het front (x en y); in het **Zijaanzicht** sleep je ze in de diepte (z). Klik een driver aan en vul onder **Positie van …** de getallen exact in, op de millimeter. Met de pijltjestoetsen verschuif je 1 mm, met Shift 10 mm. Tijdens het slepen klikt een driver vast op de middenlijn van het front en op de x of y van de andere drivers (je ziet dan een stippellijn), zodat ze exact uitgelijnd staan. Met de knoppen **Horizontaal uitlijnen** en **Verticaal uitlijnen** zet je in één keer alle drivers op dezelfde hoogte (een center met de woofers naast elkaar) of op dezelfde verticale lijn (een boekenplank of toren). Houd de drivers op één verticale lijn; de tweeter komt op oorhoogte, meestal 85 tot 100 cm boven de vloer als de kast op een standaard staat.

![Voor- en zijaanzicht van de kast met sleepbare drivers en de positievelden eronder.](img/placement.webp)
*Voor- en zijaanzicht van de kast met sleepbare drivers en de positievelden eronder.*

**Diepte: montagevlak en akoestisch centrum**

- **Montagevlak t.o.v. front** is waar de driver in het hout zit: 0 is gelijk met het front, negatief is teruggelegd (een trapbaffle of een verzonken tweeter).
- **Akoestisch centrum achter montagevlak** is waar het geluid vandaan lijkt te komen: bij een dome vrijwel op de flens (0 mm), bij een conus enkele centimeters erachter, rond de spreekspoel. De knop **Schatten** vult een redelijke waarde in, of de waarde uit de kop van het fabrieksbestand als die er is.
- Verplaats je het montagevlak, dan schuift het akoestisch centrum mee; de diepte erachter blijft gelijk.

**Waarom dit de klank verandert.** Een woofer en een tweeter die samen één toon maken rond de scheidingsfrequentie, moeten die op hetzelfde moment bij je oor laten aankomen. Staat het akoestisch centrum van de woofer 3 cm verder naar achteren dan dat van de tweeter, dan komt zijn geluid later aan en vult het rond de scheiding niet goed aan: een dip of juist een bult, en een andere richtwerking omhoog en omlaag. Door de tweeter een paar centimeter terug te leggen (trapbaffle) of de scheiding anders te kiezen, breng je ze in lijn. Je ziet het effect direct in de som in stap 4 en in het luistervenster in stap 5.

Let op: bij fabrieksbestanden met een gedeelde tijdreferentie zit de diepte al in de meting en telt hij alleen buiten de as mee. Bij een model uit Thiele/Small-waarden of minimum-fase-data rekent LobeWise de diepte ook op de as mee. Het veld zegt welk van de twee geldt.

**Kamers**

Elke woofer heeft een kamer. Klik erop en kies:

- **Type**: *Gesloten* is het eenvoudigst en vergeeft het meest. *Basreflex* geeft meer laag, maar vraagt een goede poort. *Aperiodisch* zit ertussen. De andere typen zijn voor gevorderden.
- **Netto volume**: begin met het kastadvies van de driver. Groter geeft dieper maar slapper laag; kleiner geeft strakker maar minder diep laag.
- **Poort** (bij basreflex): kies een diameter van minstens 5 cm voor een 6,5-inch woofer en klik **Afstemmen op … Hz**: LobeWise berekent de lengte. Mik op een afstemming rond de fs van de woofer of iets eronder.

**Waar je op let in de controles**

- **Conusuitslag**: de woofer mag bij je maximale niveau niet verder bewegen dan zijn Xmax. Rood? Kies een kleinere kast, zet basbeheer aan (stap 1) of accepteer een lager maximaal niveau.
- **Luchtsnelheid in de poort**: onder 17 m/s is stil, boven 30 m/s hoor je de poort blazen. Rood? Grotere poortdiameter (en dus langer).
- **Pijpresonantie**: een lange poort fluit op een eigen toon. De controle zegt of die in het bereik van de woofer valt.
- **Drivers overlappen** of **buiten het front**: de knop schuift ze naar een vrije plek.
- **Montagevlak buiten de kast**: een driver die achter de achterwand zou zitten. Sleep hem in het zijaanzicht terug.
- **Kast voldoet niet**: het netto volume past niet in de buitenmaten. De knop maakt de kast dieper.

> **Door als:** Kast groen is, of oranje met alleen waarschuwingen die je begrijpt. Rood betekent: dit bouw je zo niet.

### Stap 4: Crossover

Het filter verdeelt het signaal over de drivers. Dit is de stap waar de klank wordt bepaald.

![Stap 4, Crossover: het schema met versterker, onderdelen en drivers.](img/crossover.webp)
*Stap 4, Crossover: het schema met versterker, onderdelen en drivers.*

**Begin met een template**

Open de kaart **Template (startpunt)** en kies een tweeweg LR4 (24 dB per octaaf) of LR2 (12 dB per octaaf) rond de frequentie die bij je drivers past. Vuistregel: minstens twee keer de resonantiefrequentie van de tweeter, en niet hoger dan waar de woofer begint te bundelen (ongeveer 340 ÷ zijn diameter in meters, in Hz: een 16 cm woofer tot ongeveer 2100 Hz).

**Het schema lezen**

- **AMP1** is de versterker. Links is plus, de massa staat eronder.
- Een onderdeel **in serie** staat in de lijn naar de driver. Een onderdeel **naar massa** (met het massasymbool) is een shunt.
- Klik op een onderdeel om de waarde, de verliezen (DCR van een spoel, ESR van een condensator) en de belasting te zien.
- Klik op een driver om hem **om te polen** (−). Bij een LR2-filter is dat voor de tweeter bijna altijd nodig.

**De grafieken**

![De akoestische respons: som en drivers apart, met de controles eronder.](img/crossover-sum.webp)
*De akoestische respons: som en drivers apart, met de controles eronder.*

- **Akoestische respons**: de som (dik) en de drivers apart. Mik op een vlakke som; een lichte daling naar hoge tonen is normaal en klinkt prettig.
- **Impedantie**: de laagste waarde mag niet onder de minimale belasting van je versterker komen.
- **Groepsvertraging**: hoe constanter, hoe beter. Bulten rond de scheidingsfrequentie wijzen op een fasefout.

**De drie controles die ertoe doen**

1. **Laagste impedantie**: groen als hij boven 80 % van de minimale belasting blijft.
2. **EPDR**: hoe zwaar de versterker het echt krijgt, inclusief fasehoek. De knop *Onderdelen aanpassen voor een lichtere belasting* lost dit vaak op zonder dat de klank verandert.
3. **Geen signaal**: een driver krijgt niets (vergeten draad, 0 µF). De uitleg zegt welke.

**Tip.** Druk op **Alles oplossen** als je het schema hebt staan. Kijk daarna in de lijst wat er gedaan is. Snap je iets niet, dan maak je het ongedaan en lees je de uitleg bij die controle.

**Schema ordenen** tekent het schema netjes opnieuw. **Bord (zoals gebouwd)** laat zien hoe het eruitziet op een plankje: dat komt terug in deel B.

> **Door als:** Crossover groen is ("Voldoet binnen model"). Oranje op EPDR mag, als je versterker ruim bemeten is.

### Stap 5: Verificatie

Hier staat alles bij elkaar, plus de controles op richtwerking die de andere stappen niet hebben.

![Stap 5, Verificatie: controles links, polars rechts.](img/verify.webp)
*Stap 5, Verificatie: controles links, polars rechts.*

**Vlakheid luistervenster.** Dit is de belangrijkste maat voor hoe neutraal de luidspreker klinkt, ook iets buiten de as. Groen onder 3 dB piek-piek. De knop *Filter optimaliseren op de doelcurve* laat de optimizer je onderdeelwaarden bijstellen binnen je eigen schema.

**Horizontale lobing op 30°.** Twee drivers die hetzelfde geluid maken, doven elkaar schuin uit. Zet drivers boven elkaar en dicht bij elkaar. De knop schuift ze naar elkaar toe.

**Richtwerking en polars.** De grafieken Horizontaal 0 tot 60° en Verticaal ±10/20° laten zien hoe de klank verandert als je opzij of op en neer beweegt. Mooi is: dezelfde vorm als op de as, alleen zachter.

**Afstand tot de tweeterresonantie.** De scheidingsfrequentie moet minstens drie keer zo hoog zijn als de fs van de tweeter. Anders vervormt hij bij luid spelen.

> **Door als:** Verificatie groen of oranje is en je bij elke oranje weet waarom. Blijft het luistervenster boven 3 dB, probeer dan een andere scheidingsfrequentie of een andere steilheid in stap 4.

### Stap 6: Kamer

Een luidspreker klinkt in een kamer anders dan in de simulatie. Deze stap laat zien wat jouw kamer doet.

![Stap 6, Kamer: afmetingen en materialen links, bovenaanzicht met reflectiepaden rechts.](img/room.webp)
*Stap 6, Kamer: afmetingen en materialen links, bovenaanzicht met reflectiepaden rechts.*

1. Vul **Breedte**, **Diepte** en **Hoogte** van de kamer in en kies de **Inrichting** (kaal, gemeubileerd, gedempt).
2. Sleep in het **Bovenaanzicht** de luidsprekers en de luisterplek op hun plek. Zet **Reflecties** op *1e orde* om alleen de zes directe reflecties te zien.
3. Kies per vlak het **Materiaal**: raam, gipsplaat, houten vloer, tapijt.

**Waar je op let**

- **Voorwand-reflectie (SBIR)**: een dip rond 100 tot 300 Hz door de muur achter de luidspreker. Oplossing: dichter bij de muur (onder 30 cm) of juist verder weg (meer dan 1 m).
- **Kamermodi**: staande golven onder de Schroeder-frequentie. Een andere luisterplek helpt vaak meer dan een andere luidspreker.
- **Vloer- en plafondreflectie**: hangt af van de hoogte van de tweeter en je oren.

Fixes die je Doelen veranderen (zoals de luisterafstand) past Alles oplossen niet vanzelf toe. Je ziet ze in de lijst met een knop **Toch toepassen**.

> **Door als:** je begrijpt welke dips van de kamer komen en welke van de luidspreker. Oranje is hier normaal; een kamer is nooit perfect.

### Stap 7: Luisteren

Nu hoor je je ontwerp, op de koptelefoon, in jouw kamer.

![Stap 7, Luisteren: veilig luisteren, bron, A/B en de paden per wand.](img/listen.webp)
*Stap 7, Luisteren: veilig luisteren, bron, A/B en de paden per wand.*

1. **Eerst: veilig luisteren.** Zet het volume van je computer laag, zet je koptelefoon op, vink het vakje aan en klik **Audio voorbereiden**.
2. Kies een **Bron**: roze ruis of een eigen muziekbestand (WAV, MP3, FLAC). Klik **Afspelen**.
3. Onder **Kamer en paden** zet je wanden aan en uit. Zo hoor je wat de zijwanden of de vloer doen.
4. Onder **Vergelijken (A/B)** zet je twee varianten naast elkaar, bijvoorbeeld met en zonder kamer, of twee crossovers. Druk op A of B tijdens het spelen.
5. De **Geleide luistertests** stellen je een vraag ("zet de zijwanden uit, wat verandert er?") en leren je horen waar je naar luistert.

> **Klaar met ontwerpen als:** de som vlak is, de impedantie veilig, het luistervenster onder 3 dB, en je het ontwerp prettig vindt klinken. Dan ga je bouwen.

---

## Deel B: bouwen

**Het bord.** Ga naar stap 4 en kies **Bord (zoals gebouwd)**. Je ziet de onderdelen op een plankje, met de draden van de versterker (rood) en terug (grijs). Kruisende draden zijn alleen verbonden bij een stip. De maten zijn geschat; meet je eigen onderdelen voordat je boort. **Bord exporteren (SVG, 1:1 mm)** geeft een sjabloon om af te drukken.

![Het bord zoals gebouwd: onderdelen op een plankje, rode signaaldraden, grijze retour.](img/board.webp)
*Het bord zoals gebouwd: onderdelen op een plankje, rode signaaldraden, grijze retour.*

**Onderdelen kopen.** Klik op een onderdeel in het schema voor de waarde en de belasting. Koop condensatoren en spoelen uit de E-reeks die het dichtst bij de waarde liggen; de optimizer in stap M4 rondt later ook zo af. Let op de belasting: een weerstand die 8 W moet verdragen, koop je als 10 W.

**Exporteren.** In stap M5, kaart **Exporteren**, staat het bouwpakket: een stuklijst (CSV), een printbaar bouwblad, het schema als SVG en een .crover-bestand dat je in Crover kunt openen.

**Bouwstatus.** In stap M5 houdt elke variant zijn status bij: Concept, Gesimuleerd, Componenten gekozen, Gebouwd, Gemeten. Zet hem op *Gebouwd* als de kast dicht is. Dat voorkomt dat je later een voorstel verwart met wat er echt in zit.

**Veilig bouwen.** Sluit de versterker pas aan als alles vastzit en gecontroleerd is. Meet met een multimeter of er geen kortsluiting tussen plus en min zit voordat je de eerste toon speelt.

---

## Deel C: meten en afstemmen

### Stap M1: Meten

Hier meet je wat je hebt gebouwd. LobeWise stuurt de microfoon nooit naar de luidsprekers, en vraagt alleen om toegang als jij op een knop drukt.

![Stap M1, Meten: microfoon openen, kanaal bevestigen met een zacht testsignaal, optioneel een SPL-meter.](img/measure.webp)
*Stap M1, Meten: microfoon openen, kanaal bevestigen met een zacht testsignaal, optioneel een SPL-meter.*

**Voorbereiden**

1. Sluit de meetmicrofoon aan. Klik onder **1. Microfoon** op **Microfoon openen** (de browser vraagt dan om toestemming), kies de microfoon en laad het **Kalibratiebestand van de microfoon** als je er een hebt.
2. Zet de luidspreker op zijn plek en de microfoon op oorhoogte, op 1 meter recht voor de tweeter (voor een meting van de luidspreker zelf) of op de luisterplek (voor een meting mét kamer).
3. Vul de **Afstand tot luidspreker** in. Zet het **Gating-venster** op 0 als je de kamer wilt meenemen, of laat LobeWise een venster kiezen voor een meting zonder kamer.

**Zelf meten**

1. Kies onder **2. Uitgang en kanaal** het kanaal en klik **Zacht testsignaal (−30 dBFS)**. Hoor je het uit de juiste luidspreker, vul dan in wat je hoorde en vink *Alleen uit die luidspreker* aan.
2. Kies **Van**, **Tot** en **Duur** van de sweep. Begin met een laag **Niveau** en verhoog het tot de meter in het groen staat, zonder clipping.
3. Zet **Herhalingen** op 2 of meer: LobeWise meet of de herhalingen gelijk zijn en waarschuwt bij ruis of beweging.
4. Heb je een SPL-meter? Leg hem naast de microfoon en gebruik **2b. Absolute SPL**: LobeWise speelt vijf seconden roze ruis, jij vult af wat de meter aanwijst. Daarna zijn je metingen in echte dB SPL.
5. Bewaar de meting. Hij komt in **Metingen** met type en referentie.

**Of importeer uit REW** met **REW-meting importeren**. Geef aan wat voor meting het is (luidspreker, luisterplek) en of hij gevensterd is.

**Diagnose.** Onder **Diagnose** vergelijkt LobeWise de meting met de voorspelling en zegt waar een afwijking vandaan komt: de luidspreker, de ruimte, een meetartefact of te weinig data. Lees dit voordat je gaat corrigeren.

> **Door als:** je een meting hebt die betrouwbaar is (herhalingen gelijk, geen clipping) en de diagnose geen meetfout meldt.

### Stap M2: Digitaal tunen

Hier maak je een correctie die je eerst digitaal uitprobeert.

![Stap M2, Digitaal tunen: meting kiezen, correctie, doelcurve en grafieken.](img/tune.webp)
*Stap M2, Digitaal tunen: meting kiezen, correctie, doelcurve en grafieken.*

1. Kies onder **Actief** de **Meting** en klik **+ Nieuwe correctie**.
2. Stel de **Doelcurve** in. Voor een huiskamer: een **Helling** van ongeveer −1 dB per octaaf (iets warmer dan recht), **Correctieband van** 30 tot 300 Hz voor alleen het laag, of tot 10 kHz voor de hele luidspreker. Zet **Natuurlijke roll-off** aan zodat de EQ geen bas probeert te maken die de luidspreker niet kan.
3. Klik **Autotune**. LobeWise maakt een **Kandidaat** met parametrische filters, alleen snijdend (geen versterking), binnen de **Grenzen** die je ziet. Kijk in **Meting, doel en voorspelling** wat er verandert.
4. Bevalt het, klik **Toepassen**. Zo niet, pas de grenzen aan en probeer opnieuw. Je kunt elk filter ook met de hand bijstellen.

**Wat je niet moet doen.** Dips door kamermodi en SBIR met EQ opvullen: dat kost vermogen en uitslag, en op een andere plek in de kamer klinkt het slechter. Snij pieken weg, laat dips met rust.

> **Door als:** de voorspelde respons binnen ongeveer 3 dB van je doelcurve ligt en de headroom-meter niet rood is.

### Stap M3: Afspelen en A/B

Hier luister je met je eigen muziek, door de echte luidsprekers, met en zonder correctie.

![Stap M3, Afspelen en A/B: eigen muziek, DSP aan/uit, niveaugelijk vergelijken.](img/play.webp)
*Stap M3, Afspelen en A/B: eigen muziek, DSP aan/uit, niveaugelijk vergelijken.*

1. Kies een **Muziekbestand** en zet **Volume** laag. Klik Afspelen.
2. **DSP** aan en uit schakelt de correctie. De wissel is vloeiend, zonder klik.
3. Onder **Correctie en A/B** vergelijk je twee varianten *niveaugelijk*: dan hoor je het verschil in klank, niet in luidheid. Luidere klinkt namelijk altijd beter.
4. Let op de **clip- en headroommeter**. Rood betekent dat de correctie te veel versterkt; verlaag de **Preamp**.

> **Door als:** je met zekerheid kunt zeggen welke variant je mooier vindt. Twijfel je, dan is het verschil te klein om voor te bouwen.

### Stap M4: Passief herontwerpen

De correctie die je digitaal mooi vond, zet LobeWise nu om in andere waarden voor de onderdelen in je crossover.

![Stap M4, Passief herontwerpen: welke correcties, doel, grenzen en vergrendelen.](img/redesign.webp)
*Stap M4, Passief herontwerpen: welke correcties, doel, grenzen en vergrendelen.*

1. Kies onder **Welke correcties horen bij de luidspreker?** alleen de filters die iets aan de luidspreker zelf corrigeren. Kamercorrecties laat je uit: die horen niet in een passief filter.
2. Kies het **Doel**: de gekozen correcties, of direct de doelcurve van stap M2.
3. Stel de **Grenzen** in: van 100 tot 16000 Hz, **Waarde mag veranderen tot** 2 × (of ÷), en een paar **Starts**. Onderdelen die je niet wilt veranderen, **Vergrendel** je.
4. Klik op onderzoeken. Het **Voorstel** toont de nieuwe waarden, afgerond naar de E-reeks, met de respons en de EPDR vóór en na. Het komt in **Varianten** als *Passief voorstel, nog niet gebouwd*.
5. Luister ernaar in stap M3 (voorbeluistering) voordat je onderdelen koopt.

Staat er **Nog niet mogelijk**, dan ontbreekt er data (meestal een meting van de losse drivers in de kast, zie stap M1). De kaart **Wat ontbreekt** zegt wat.

> **Door als:** het voorstel de doelcurve dichter benadert dan het origineel, de impedantie veilig blijft en je het voorbeluisterd hebt.

### Stap M5: Bouwen en controleren

![Stap M5, Bouwen en controleren: welke variant bouw je, bevestigen en controlemeting.](img/build.webp)
*Stap M5, Bouwen en controleren: welke variant bouw je, bevestigen en controlemeting.*

1. Kies onder **Welke variant bouw je?** het voorstel uit M4, of klik **Huidig schema vastleggen als variant** als je het oorspronkelijke schema bouwt.
2. Koop de onderdelen en meet ze met een LCR-meter als je die hebt. Vul onder **Gemonteerde onderdelen bevestigen** de echte waarden in. LobeWise rekent dan met wat er echt in zit.
3. Zet de bouwstatus op *Gebouwd*.
4. Meet opnieuw (stap M1) op precies dezelfde plek als de eerste meting.
5. Onder **Controlemeting tegen de variant** vergelijkt LobeWise de gemeten verandering met de voorspelde. Komt het overeen, dan is je ontwerp af. Wijkt het af, dan zegt de diagnose waar je moet kijken.

## Deel D: wanneer is het audiofiel?

Je bent klaar als dit allemaal waar is:

- **Som op de as**: vlak binnen ±2 dB van 100 Hz tot 10 kHz, met een rustige, geleidelijke daling daarboven.
- **Luistervenster**: onder 3 dB piek-piek. Dit zegt meer dan de curve op de as.
- **Richtwerking**: de curves buiten de as hebben dezelfde vorm als op de as, zonder gat rond de scheidingsfrequentie.
- **Impedantie**: de laagste waarde boven de minimale belasting van de versterker, EPDR groen of een bewust geaccepteerde oranje.
- **Uitslag en poort**: groen bij je maximale niveau.
- **Kamer**: je kent de dips van je kamer en hebt de opstelling erop aangepast, niet de luidspreker.
- **Controlemeting**: de gemeten verandering komt overeen met de voorspelde.
- **Je oren**: in een niveaugelijke A/B kies je steeds dezelfde variant.

---

## Veelgemaakte fouten

- **Te veel bas willen uit een kleine kast.** Zet basbeheer aan of accepteer een hogere ondergrens. Een kleine luidspreker die niet te diep hoeft, klinkt strakker dan een die overvraagd wordt.
- **Een rode controle wegklikken.** Rood is rood. Oranje mag je accepteren als je de uitleg snapt.
- **De tweeter te laag scheiden.** Houd minstens drie keer zijn fs aan.
- **Kamerdips met EQ opvullen.** Snij pieken, laat dips met rust, verplaats de luidspreker of de stoel.
- **Vergelijken zonder niveaugelijkheid.** De luidere variant wint altijd. Gebruik de A/B van LobeWise.
- **Fabrieksbestanden als één meting behandelen.** Losse bestanden hebben niet altijd dezelfde tijdreferentie. Twijfel je, meet dan zelf vanaf één microfoonpositie.
- **De bordtekening blind volgen.** Meet je eigen onderdelen voordat je boort.

---

## Woordenlijst

- **FRD / ZMA**: tekstbestanden met de frequentierespons (FRD) en de impedantie (ZMA) van een driver.
- **Thiele/Small (T/S)**: de getallen op een datasheet (fs, Qts, Vas, …) waarmee je het laag van een driver in een kast kunt berekenen.
- **fs**: resonantiefrequentie van een driver. Daaronder doet hij weinig meer.
- **Xmax**: hoe ver de conus lineair kan bewegen.
- **Basreflex / gesloten / aperiodisch**: kast met poort, kast zonder opening, of kast met een gedempte opening.
- **Crossover / scheidingsfilter**: het netwerk van spoelen, condensatoren en weerstanden dat het signaal over de drivers verdeelt.
- **LR2 / LR4**: Linkwitz-Riley-filters van 12 en 24 dB per octaaf. LR4 scheidt strakker, LR2 heeft minder onderdelen.
- **Impedantie / Zmin**: de weerstand die de versterker "ziet", en de laagste waarde daarvan.
- **EPDR**: de weerstand die een versterker voelt als je ook de fasehoek meerekent. Lager dan Zmin, en eerlijker.
- **Luistervenster**: het gemiddelde van de respons recht vooruit en iets ernaast (±10° en ±30°), volgens CTA-2034.
- **Lobing**: uitdoving schuin voor de luidspreker doordat twee drivers op verschillende afstand van je oor staan.
- **Baffle-diffractie**: het effect van de randen van het front op de klank: een stap rond een paar honderd Hz en rimpels erboven.
- **SBIR**: de dip door de reflectie van de muur achter de luidspreker.
- **Kamermodi / Schroeder-frequentie**: staande golven in een kamer, en de frequentie waaronder ze het geluid bepalen.
- **Gating / venster**: een deel van een meting afknippen zodat de kamerreflecties er niet in zitten.
- **PEQ**: parametrische equalizer: een filter met frequentie, breedte (Q) en niveau.
- **E-reeks**: de standaardwaarden waarin onderdelen te koop zijn (E12, E24).
- **DCR / ESR**: de weerstand van een spoel (DCR) en van een condensator (ESR). Kleine verliezen die de klank meebepalen.
